syntax = "proto3";
package helloworld;

service Greeter {
    rpc SayHello (HelloRequest) returns (HelloReply);
    rpc SayGoodbye (ByeRequest) returns (ByeResponse);
}

message HelloRequest {
    string name = 1;
}

message HelloReply {
    string message = 1;
}

message ByeRequest {
    string name = 1;
}

message ByeResponse {
    string message = 1;
}